name: Repair Index Tool Views

on:
  push:
    branches:
      - fix/index-tools-2026-09-16

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore missing V3 view functions
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path('app-v3.js')
          baseline = subprocess.check_output(
              ['git', 'show', 'f260a013922acf910a4fb5ff313d7eb32b9a69fd5:app-v3.js'],
              text=True,
              encoding='utf-8'
          )
          current = path.read_text(encoding='utf-8')

          base_lines = baseline.splitlines()
          current_lines = current.splitlines()

          def get_line(lines, marker):
              for line in lines:
                  if marker in line:
                      return line
              raise SystemExit(f'Missing baseline marker: {marker}')

          search_fn = get_line(base_lines, 'function search(')
          panic_fn = get_line(base_lines, 'function panic(')
          help_fn = get_line(base_lines, 'function help(')

          if any('function search(' in line for line in current_lines):
              raise SystemExit('function search() already exists; refusing duplicate insert')
          if any('function panic(' in line for line in current_lines):
              raise SystemExit('function panic() already exists; refusing duplicate insert')
          if any('function help(' in line for line in current_lines):
              raise SystemExit('function help() already exists; refusing duplicate insert')

          render_index = next(
              (i for i, line in enumerate(current_lines) if line.startswith('function render(')),
              None
          )
          if render_index is None:
              raise SystemExit('Current render() not found')

          current_lines[render_index] = current_lines[render_index].replace(
              "if(state.route==='search')content=searchPage();",
              "if(state.route==='search')content=search();",
              1
          )

          if 'searchPage()' in current_lines[render_index]:
              raise SystemExit('searchPage() reference still present after replacement')

          current_lines[render_index:render_index] = [search_fn, panic_fn, help_fn]
          path.write_text('\n'.join(current_lines) + '\n', encoding='utf-8', newline='\n')

      - name: Syntax check
        run: node --check app-v3.js

      - name: Verify repaired symbols
        shell: python
        run: |
          text = open('app-v3.js', encoding='utf-8').read()
          for symbol in ('function search(', 'function panic(', 'function help('):
              assert symbol in text, symbol
          assert 'searchPage()' not in text
          print('Verified: search(), panic(), help() restored and searchPage() removed.')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v3.js
          git diff --cached --check
          git diff --cached -- app-v3.js
          git commit -m 'fix: restore missing index tool views'
          git push
