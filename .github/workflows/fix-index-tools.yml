name: Fix Index Tools

on:
  push:
    branches:
      - fix/index-tools-final-2026-09-16

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore only missing Index view functions
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path('app-v3.js')
          current = path.read_text(encoding='utf-8')
          baseline = subprocess.check_output(
              ['git', 'show', 'f260a013922acf910a4fb5ff313d7eb32b9a69fd:app-v3.js'],
              text=True,
              encoding='utf-8'
          )

          def extract(text, start, end):
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b]

          if 'function search(' in current or 'function panic(' in current or 'function help(' in current:
              raise SystemExit('Unexpected existing repair symbols; refusing to overwrite.')

          search_fn = extract(baseline, 'function search(', 'function collection(')
          panic_fn = extract(baseline, 'function panic(', 'function help(')
          help_fn = extract(baseline, 'function help(', 'function render(')

          render_pos = current.index('function render(')
          current = current[:render_pos] + search_fn + panic_fn + help_fn + current[render_pos:]

          old = "if(state.route==='search')content=searchPage();"
          new = "if(state.route==='search')content=search();"
          if old not in current:
              raise SystemExit('searchPage() render call not found.')
          current = current.replace(old, new, 1)

          path.write_text(current, encoding='utf-8', newline='\n')

      - name: Syntax and invariant checks
        shell: bash
        run: |
          set -e
          node --check app-v3.js
          grep -q "function search(" app-v3.js
          grep -q "function panic(" app-v3.js
          grep -q "function help(" app-v3.js
          grep -q "function render(" app-v3.js
          grep -q "if(state.route==='search')content=search();" app-v3.js
          ! grep -q "searchPage()" app-v3.js
          ! grep -q "tegory(" app-v3.js
          echo "PASS: syntax + Index view invariants"

      - name: Commit repaired app-v3.js
        shell: bash
        run: |
          git diff --check
          git add app-v3.js
          git diff --cached --check
          git diff --cached -- app-v3.js
          git commit -m 'fix: restore missing index tool views'
          git push
