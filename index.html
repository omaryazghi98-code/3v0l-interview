<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>3v0l Interview Command Center</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="brand" data-route="index" aria-label="Back to Index">
        <span class="brand-mark">3</span><span>3v0l</span><span class="brand-muted">INTERVIEW</span>
      </button>
      <div class="top-actions">
        <div class="live-pill"><span class="dot"></span> LIVE READY</div>
        <button class="icon-btn" data-action="font-down" title="Smaller text">A−</button>
        <button class="icon-btn" data-action="font-up" title="Larger text">A+</button>
        <button class="icon-btn" data-route="search" title="Smart search">⌕</button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="hotbar">
      <div class="hotbar-left"><kbd>H</kbd> Home <kbd>/</kbd> <kbd>Esc</kbd> Back</div>
      <div class="hotbar-center"><kbd>↑</kbd><kbd>↓</kbd> Scroll <kbd>Space</kbd> Next</div>
      <button class="panic-btn" data-route="panic"><span>⚠</span> PANIC</button>
    </footer>
  </div>
  <script src="data/content.js"></script>
  <script src="app.js"></script>
</body>
</html>
